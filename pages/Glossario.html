<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glossário | Arboriza</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Alice&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="Glossario.css">
</head>
<body>
<header class="site-header">
    <div class="header-container">
        <a href="Home.html" class="brand">
            <img class="brand-logo" src="../assets/logo.png" alt="Logo Arboriza">
            <span class="brand-text">
                Mais árvores.<br>
                Cidades mais frescas.
            </span>
        </a>
        <nav class="main-navigation">
            <a href="Home.html" class="nav-link">Início</a>
            <a href="artigos.html" class="nav-link">Artigos</a>
            <a href="Glossario.html" class="nav-link active">Glossário</a>
            <a href="midia.html" class="nav-link">Mídia</a>
        </nav>
    </div>
</header>

<main>
    <section class="glossary-hero">
        <div class="glossary-hero-icon">
            <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M12 6.5c-1.6-1.3-3.7-2-6-2v13c2.3 0 4.4.7 6 2 1.6-1.3 3.7-2 6-2v-13c-2.3 0-4.4.7-6 2z"></path>
                <path d="M12 6.5v13"></path>
            </svg>
        </div>
        <div class="glossary-hero-text">
            <h1>Glossário</h1>
            <p>Entenda os principais termos e conceitos sobre arborização urbana e clima.</p>
        </div>
    </section>

    <section class="glossary-search">
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Buscar no glossário..." aria-label="Buscar no glossário">
            <button type="button" aria-label="Buscar">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <circle cx="11" cy="11" r="7"></circle>
                    <line x1="16.5" y1="16.5" x2="21" y2="21"></line>
                </svg>
            </button>
        </div>
        <div class="alphabet-filter" id="alphabetFilter"></div>
    </section>

    <section class="glossary-terms" id="termsGrid"></section>

    <div class="view-all-wrap">
        <a href="../assets/Glossario.pdf" target="_blank" rel="noopener noreferrer" class="view-all-button">Ver todo o glossário</a>
    </div>

    <section class="city-image-section">
        <img src="../assets/imagem.png" alt="Vegetação urbana e edifícios">
    </section>
</main>

<footer class="site-footer">
    <div class="footer-container">
        <div class="footer-brand">
            <img class="footer-logo" src="../assets/logo-branca.png" alt="Logo Arboriza">
            <span class="footer-line"></span>
            <p>
                Mais árvores.<br>
                Cidades mais frescas.
            </p>
        </div>
        <p class="copyright">Copyright © 2026 – Arboriza</p>
        <div class="footer-message">
            <div class="footer-leaf">
                <svg viewBox="0 0 64 64" aria-hidden="true">
                    <path d="M32 58V25"></path>
                    <path d="M32 35C20 34 12 27 10 17C22 17 30 23 32 35Z"></path>
                    <path d="M32 43C44 42 52 35 54 25C42 25 34 31 32 43Z"></path>
                </svg>
            </div>
            <p>
                Juntos por cidades<br>
                mais verdes.
            </p>
        </div>
    </div>
</footer>

<script src="Glossario.js"></script>
</body>
</html>
