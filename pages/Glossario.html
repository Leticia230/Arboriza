<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Glossário | Arboriza</title>
<link rel="stylesheet" href="Glossario.css">
</head>
<body>

  <header class="site-header">
    <div class="container header-inner">
      <a href="#" class="brand">
        <span class="brand-icon">
          <img  class="logo" src="../assets/logo.png" alt="Logo da Arboriza">
        </span>
        <span class="brand-text">
          <small>Mais árvores. Cidades mais frescas.</small>
        </span>
      </a>
      <nav class="main-nav">
        <a href="#">Início</a>
        <a href="#">Artigos</a>
        <a href="#" class="active">Glossário</a>
        <a href="#">Mídia</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="glossary-hero container">
      <div class="glossary-hero-icon" aria-hidden="true">
        <svg width="34" height="34" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 6.5c-1.6-1.3-3.7-2-6-2v13c2.3 0 4.4.7 6 2 1.6-1.3 3.7-2 6-2v-13c-2.3 0-4.4.7-6 2z" stroke="#2f3d31" stroke-width="1.6" stroke-linejoin="round"/>
          <path d="M12 6.5v13" stroke="#2f3d31" stroke-width="1.6"/>
        </svg>
      </div>
      <div class="glossary-hero-text">
        <h1>Glossário</h1>
        <p>Entenda os principais termos e conceitos sobre arborização urbana e clima.</p>
      </div>
    </section>

    <section class="glossary-search container">
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="Buscar no glossário...">
        <button type="button" aria-label="Buscar">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="11" cy="11" r="7" stroke="#7a8a7a" stroke-width="2"/>
            <line x1="16.5" y1="16.5" x2="21" y2="21" stroke="#7a8a7a" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </button>
      </div>

      <div class="alphabet-filter" id="alphabetFilter"></div>
    </section>

    <section class="glossary-terms container" id="termsGrid">
      <!-- Cards inseridos via JS a partir dos dados do glossário -->
    </section>

    <div class="view-all-wrap container">
      <button type="button" class="btn-outline" id="viewAllBtn">Ver todo o glossário</button>
    </div>

    <section>  <img class="img-footer" src="../assets/imagem.png" alt="Imagem do glossário"> </img> </section>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <div class="footer-brand">
        <span class="brand-icon small">
          <img class="logo" src="../assets/logo.png" alt="Logo da Arboriza">
        </span>
        <span>ARBORIZA</span>
      </div>

      <p class="footer-tagline">Informação, ciência e ação<br>por cidades mais verdes.</p>

      <p class="footer-copy">Copyright © 2026 – Arboriza</p>

      <div class="footer-social">
        <a href="#" aria-label="Instagram">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><rect x="2" y="2" width="20" height="20" rx="5" stroke="#fff" stroke-width="1.6"/><circle cx="12" cy="12" r="4.2" stroke="#fff" stroke-width="1.6"/><circle cx="17.3" cy="6.7" r="1.1" fill="#fff"/></svg>
        </a>
        <a href="#" aria-label="YouTube">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><rect x="2" y="5" width="20" height="14" rx="4" stroke="#fff" stroke-width="1.6"/><path d="M10 9.5l5 2.5-5 2.5v-5z" fill="#fff"/></svg>
        </a>
        <a href="#" aria-label="Spotify">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="10" stroke="#fff" stroke-width="1.6"/><path d="M7 10c3-1 7-1 10 1M7.5 13c2.5-.8 5.5-.6 8 .8M8 16c2-.6 4.5-.4 6.3.8" stroke="#fff" stroke-width="1.4" stroke-linecap="round"/></svg>
        </a>
      </div>

      <p class="footer-slogan">Juntos por um futuro<br>mais sustentável.</p>
    </div>
  </footer>

<script src="Glossario.js"></script>
</body>
</html>
