
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar | Arboriza</title>

    <link rel="stylesheet" href="conta.css">
    <link rel="stylesheet" href="header.css">
    <link rel="stylesheet" href="footer.css">

    <script src="header.js" defer></script>
    <script type="module" src="conta.js"></script>
</head>
<body>
    <site-header></site-header>

    <main class="account-main">
        <section class="account-card">
            <p class="account-eyebrow">Bem-vindo de volta</p>
            <h1>Entrar</h1>
            <p class="account-description">
                Acesse sua conta para acompanhar sua participação no Arboriza.
            </p>

            <form id="login-form" class="account-form">
                <div class="account-field">
                    <label for="login-email">Email</label>
                    <input
                        type="email"
                        id="login-email"
                        autocomplete="email"
                        placeholder="voce@exemplo.com"
                        required
                    >
                </div>

                <div class="account-field">
                    <label for="login-password">Senha</label>
                    <input
                        type="password"
                        id="login-password"
                        autocomplete="current-password"
                        placeholder="Digite sua senha"
                        required
                    >
                </div>

                <div id="login-message" class="account-message"
                     role="status" aria-live="polite"></div>

                <button class="account-button" type="submit">
                    Entrar na minha conta
                </button>
            </form>

            <div class="account-links">
                <a href="#" id="forgot-password">Esqueci minha senha</a>
                <span>
                    Ainda não tem conta?
                    <a href="Cadastro.html">Cadastre-se</a>
                </span>
            </div>
        </section>
    </main>

    <site-footer></site-footer>

    <script src="Footer.js" defer></script>
    <script type="module" src="conta.js"></script>
    <script type="module" src="auth.js"></script>
    
</body>

</html>
